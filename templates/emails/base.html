{% load i18n %}<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>{% block subject %}thedevu101{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#eceeeb; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <!-- Preheader (hidden preview text) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent; height:0; width:0;">{% block preheader %}{% endblock %}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eceeeb;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #e2e5e1; border-radius:16px; overflow:hidden; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

          <!-- Brand header -->
          <tr>
            <td style="background-color:#0f7a5a; padding:22px 32px;">
              <a href="{{ site_url|default:'https://thedevu101.uz' }}" style="text-decoration:none; color:#ffffff; font-size:19px; font-weight:700; letter-spacing:-0.3px;">thedevu101</a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px; color:#14171c; font-size:15px; line-height:1.6;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:22px 32px; border-top:1px solid #eceeeb; background-color:#fafbfa; color:#6b7280; font-size:12px; line-height:1.6;">
              {% block footer %}
              <p style="margin:0;">© {% now "Y" %} Ulug'bek Umaraliyev — thedevu101.uz</p>
              {% endblock %}
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
